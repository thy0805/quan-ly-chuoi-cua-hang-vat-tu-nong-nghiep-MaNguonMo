<text x="70" y="848" font-size="17" class="" text-anchor="start">PK: khóa chính · FK: khóa ngoại · UK: duy nhất · AI: tự tăng</text>
<text x="70" y="882" font-size="16" class="muted" text-anchor="start">NULL: được rỗng; các cột còn lại NOT NULL.</text>
<text x="70" y="916" font-size="16" class="muted" text-anchor="start">parent_id cho phép tối đa một cha; một cha có thể có nhiều con.</text>
<text x="70" y="950" font-size="16" class="muted" text-anchor="start">Cả 3 FK: ON UPDATE RESTRICT / ON DELETE RESTRICT.</text>
<text x="70" y="984" font-size="16" class="muted" text-anchor="start">users độc lập; không tạo quan hệ nghiệp vụ giả với catalog.</text>
<text x="70" y="1030" font-size="17" class="" text-anchor="start">admin_slot: GENERATED STORED + UNIQUE; role=admin → 1, role=user → NULL.</text>
<text x="70" y="1064" font-size="16" class="muted" text-anchor="start">7 CHECK + 2 trigger tự trỏ; cycle/active references còn được kiểm trong Eloquent/domain.</text>
